schema_version: "1.0"

preset:
  id: "ai-research"
  name: "AI Research"
  version: "1.0.0"
  description: "Extension de Spec Kit pour la recherche systematique iterative avec scoring multicriteres, ontologie et checkpoints"
  author: "Olivier Coupelon"
  license: "MIT"

requires:
  speckit_version: ">=0.6.0"

provides:
  templates:
    # --- Remplacement des commandes standard ---

    # Constitution → Principes de recherche
    - type: "command"
      name: "speckit.constitution"
      file: "commands/constitution.md"
      description: "Etablir les principes et standards de qualite de la recherche"
      replaces: "speckit.constitution"

    # Specify → Definir un sujet de recherche
    - type: "command"
      name: "speckit.specify"
      file: "commands/specify.md"
      description: "Definir un sujet de recherche : probleme, criteres de succes, perimetre"
      replaces: "speckit.specify"

    # Plan → Explorer les pistes de recherche
    - type: "command"
      name: "speckit.plan"
      file: "commands/plan.md"
      description: "Explorer iterativement les pistes avec scoring de confiance et MCP"
      replaces: "speckit.plan"

    # Tasks → Evaluer et comparer les pistes
    - type: "command"
      name: "speckit.tasks"
      file: "commands/tasks.md"
      description: "Evaluer, comparer et trier les pistes par score de confiance"
      replaces: "speckit.tasks"

    # Implement → Produire un livrable (article, demo, outil)
    - type: "command"
      name: "speckit.implement"
      file: "commands/implement.md"
      description: "Produire un livrable a partir des pistes selectionnees"
      replaces: "speckit.implement"

    # --- Nouvelles commandes ---
    - type: "command"
      name: "speckit.research.checkpoint"
      file: "commands/checkpoint.md"
      description: "Synthese intermediaire et validation (toutes les 10 pistes)"

    - type: "command"
      name: "speckit.research.score"
      file: "commands/score.md"
      description: "Scorer ou re-evaluer une piste avec metriques MCP"

    # --- Templates d'artefacts ---
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Template de definition de sujet de recherche"
      replaces: "spec-template"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Template de fiche d'exploration de piste"
      replaces: "plan-template"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Template d'evaluation et comparaison de pistes"
      replaces: "tasks-template"

    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Template de principes de recherche"
      replaces: "constitution-template"

    # --- Agents (enregistres comme templates de type script) ---
    - type: "script"
      name: "agent-lead-scorer"
      file: "agents/agent-lead-scorer.md"
      description: "Scoring multicriteres des pistes via MCP academiques"

    - type: "script"
      name: "agent-ontologist"
      file: "agents/agent-ontologist.md"
      description: "Construction et maintenance de l'ontologie des idees"

tags:
  - "research"
  - "methodology"
  - "academic"
  - "scoring"
